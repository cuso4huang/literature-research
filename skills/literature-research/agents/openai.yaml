interface:
  display_name: "文献调研"
  short_description: "检索核验论文、区分版本并安全下载开放全文"
  default_prompt: "Use $literature-research to search, verify, deduplicate, and retrieve legal open full text for the literature on this topic."
dependencies:
  tools:
    - type: "mcp"
      value: "semantic-scholar"
      description: "Semantic Scholar discovery, authors, citations, and references"
    - type: "mcp"
      value: "arxiv"
      description: "arXiv preprint search and full-text retrieval"
policy:
  allow_implicit_invocation: true
